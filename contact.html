    <header class="m-3">

    <div class="container">
        <div class="row">
            <main class="formulier col-md-9">
                <section class="row">
                    <div class="col-12 mb-3">
                        <h2 class="m-3">Contact</h2>
                        <p class="m-3">Velden met een <span>*</span> zijn verplicht.</p>
                        <hr>
                    </div>
                    <form action="#" name="contact" method="POST" data-netlify="true" data-netlify-recaptcha="true" netlify-honeypot="bot-field">
                        <fieldset class="row mb-3 g-3 ">
                            <div class="mb-3 col-md-4">
                                <label for="voornaam" class="form-label">Uw naam <span>*</span></label>
                                <input type="text" name="naam" class="form-control" id="voornaam" required>
                            </div>
                            <div class="col-md-8">
                                <label for="email" class="form-label">Uw e-mail <span>*</span></label>
                                <input type="email" name="email" class="form-control" id="email" required>
                            </div>
                            <div class="col-md-10">
                                <label for="floatingTextarea" class="form-label">Uw bericht: <span>*</span></label>
                                <textarea class="form-control" name="bericht" placeholder="Ik heb hulp nodig met.." id="floatingTextarea" required></textarea>
                            </div>
                            <input type="hidden" name="form-name" value="contact">
                            <p style="display:none;">
                                <label><input name="bot-field"></label>
                            </p>
                        </fieldset>
                        <div data-netlify-recaptcha="true"></div>
                        <button type="submit" class="btn blauwe-achtergrond m-3 pe-3">verzenden</button>
                    </form>
                </section>
            </main>
